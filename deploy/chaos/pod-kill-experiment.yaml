apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: sm-notification-center-pod-kill
  namespace: sm-prod
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - sm-prod
    labelSelectors:
      app.kubernetes.io/instance: sm-notification-center
      app.kubernetes.io/name: sm-notification-center
  scheduler:
    cron: '@every 30m'
